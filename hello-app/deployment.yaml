apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
  labels:
    app: hello-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-app
  template:
    metadata:
      labels:
        app: hello-app
    spec:
      containers:
        - name: helloworld
          image: ghcr.io/pipe-cd/helloworld:v0.5.0
          args:
            - server
          ports:
            - containerPort: 9085
